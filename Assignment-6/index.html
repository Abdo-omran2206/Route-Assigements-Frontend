<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What's For Dinner</title>
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/media.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom border-1">
      <div class="container px-4">
        <a class="navbar-brand d-flex align-items-center gap-3" href="#">
          <span
            class="logo d-flex justify-content-center align-items-center rounded-circle text-white"
          >
            <i class="fa-solid fa-utensils"></i>
          </span>
          <div>
            <h1 class="fw-bold fs-6 fs-md-4 m-0">What's For Dinner</h1>
            <p class="text-secondary fs-8 fs-md-7 m-0">
              Your daily meal inspiration
            </p>
          </div>
        </a>
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <i class="fa-solid fa-bars"></i>
        </button>
        <div
          class="collapse navbar-collapse justify-content-end"
          id="navbarNav"
        >
          <ul
            class="navbar-nav align-items-lg-center my-4 my-lg-0 align-content-start gap-4 gap-lg-3"
          >
            <li class="nav-item">
              <a href="" class="d-flex align-items-center gap-2 gap-lg-3">
                <i class="fa-solid fa-bookmark"></i>
                <span class="d-lg-none d-flex fs-7">Saved Recipes</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="" class="d-flex align-items-center gap-2 gap-lg-3">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span class="d-lg-none d-flex fs-7">Recent</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="" class="d-flex align-items-center gap-2 gap-lg-3">
                <i class="fa-solid fa-gear"></i>
                <span class="d-lg-none d-flex fs-7">Settings</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="" class="d-flex align-items-center gap-2 gap-lg-3">
                <figure
                  class="avatar d-flex align-items-center justify-content-center m-0 rounded-circle overflow-hidden"
                >
                  <img
                    src="images/avatar-1.jpg"
                    alt="avatar-1"
                    loading="lazy"
                  />
                </figure>
                <span class="d-lg-none d-flex fs-7">Profile</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main>
      <section class="min-vh-100 d-flex align-items-center">
        <div class="container px-md-4 py-5">
          <div class="row main-box overflow-visible g-0 rounded-4 bg-white">
            <div class="col-12 col-lg-5">
              <div class="inner rounded-4 position-relative img-prev">
                <div
                  class="rate-badge position-absolute badge rounded-pill bg-white shadow-sm"
                >
                  <div class="d-flex align-items-center gap-2">
                    <div class="text-warning fs-8 fs-md-6">
                      <i class="fa-solid fa-star"></i>
                    </div>
                    <span
                      class="text-black fw-bold fs-8 fs-md-7"
                      id="rate"
                    ></span>
                    <span
                      class="text-secondary fs-8 fs-md-7 fw-normal"
                      id="reviews"
                    ></span>
                  </div>
                </div>
                <img id="meal-img" src="" class="" alt="" />
                <div
                  class="position-absolute rounded-4 start-50 translate-middle-x d-flex justify-content-around img-floting-data p-2 p-md-3"
                >
                  <div class="d-flex flex-column text-center">
                    <span class="prepTime fs-5 fs-md-4">
                      <i class="fa-solid fa-clock"></i
                    ></span>
                    <span class="fs-8 fs-md-7 text-secondary">Prep Time </span>
                    <span class="fs-7 fs-md-6 fw-bold text-black" id="prepTime">
                    </span>
                  </div>
                  <div class="d-flex flex-column text-center">
                    <span class="cookTime fs-5 fs-md-4">
                      <i class="fa-solid fa-fire-burner"></i
                    ></span>
                    <span class="fs-8 fs-md-7 text-secondary">Cook Time </span>
                    <span class="fs-7 fs-md-6 fw-bold text-black" id="cookTime">
                    </span>
                  </div>
                  <div class="d-flex flex-column text-center">
                    <span class="servings fs-5 fs-md-4">
                      <i class="fa-solid fa-users"></i
                    ></span>
                    <span class="fs-8 fs-md-7 text-secondary">Servings </span>
                    <span class="fs-7 fs-md-6 fw-bold text-black" id="servings">
                    </span>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-12 rounded-4 col-lg-7 ">
              <div
                class="inner text-prev rounded-4 overflow-y-scroll p-3-5 p-md-4-5 bg-white"
              >
                <div
                  class="d-flex flex-column-reverse flex-md-row justify-content-between align-items-start align-items-md-center"
                >
                  <div>
                    <div
                      id="badge-1"
                      class="badge me-2 rounded-pill badge-1"
                    ></div>
                    <div
                      id="badge-2"
                      class="badge rounded-pill badge-2"
                    ></div>
                    <h2 class="fs-4 fs-md-1 fw-bold mt-3" id="meal-title"></h2>
                    <p class="fs-7 fs-md-6" id="meal-description"></p>
                  </div>
                  <div class="d-flex gap-2 align-self-end align-self-md-center">
                    <button class="btn main-btn rounded-3">
                      <i class="fa-solid fa-bookmark"></i>
                    </button>
                    <button class="btn main-btn rounded-3">
                      <i class="fa-solid fa-share-nodes"></i>
                    </button>
                  </div>
                </div>

                <div
                  id="overtime"
                  class="overtime rounded-4 d-none align-items-center p-3 gap-2"
                >
                  <div class="fs-5">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                  </div>
                  <div>
                    <h3 class="fs-7 fs-md-6 m-0 fw-semibold">
                      Extended Preparation Time
                    </h3>
                    <p class="fs-8 fs-md-7 m-0">
                      This recipe requires more than 45 minutes to prepare. Plan
                      accordingly!
                    </p>
                  </div>
                </div>

                <div class="mt-3">
                  <ul
                    class="nav justify-content-around nav-pills mb-3 border-bottom border-1 pb-4"
                    id="pills-tab"
                    role="tablist"
                  >
                    <li class="nav-item" role="presentation">
                      <button
                        class="nav-link px-1 px-md-3 fs-8 fs-md-6 active"
                        id="pills-Ingredients-tab"
                        data-bs-toggle="pill"
                        data-bs-target="#pills-Ingredients"
                        type="button"
                        role="tab"
                        aria-controls="pills-Ingredients"
                        aria-selected="true"
                      >
                        <i class="fa-solid fa-list-check"></i>
                        Ingredients
                      </button>
                    </li>
                    <li class="nav-item" role="presentation">
                      <button
                        class="nav-link px-1 px-md-3 fs-8 fs-md-6"
                        id="pills-Instructions-tab"
                        data-bs-toggle="pill"
                        data-bs-target="#pills-Instructions"
                        type="button"
                        role="tab"
                        aria-controls="pills-Instructions"
                        aria-selected="false"
                      >
                        <i class="fa-solid fa-book-open"></i>
                        Instructions
                      </button>
                    </li>
                    <li class="nav-item" role="presentation">
                      <button
                        class="nav-link px-1 px-md-3 fs-8 fs-md-6"
                        id="pills-Nutrition-tab"
                        data-bs-toggle="pill"
                        data-bs-target="#pills-Nutrition"
                        type="button"
                        role="tab"
                        aria-controls="pills-Nutrition"
                        aria-selected="false"
                      >
                        <i class="fa-solid fa-chart-pie"></i>
                        Nutrition
                      </button>
                    </li>
                    <li class="nav-item" role="presentation">
                      <button
                        class="nav-link px-1 px-md-3 fs-8 fs-md-6"
                        id="pills-Tips-tab"
                        data-bs-toggle="pill"
                        data-bs-target="#pills-Tips"
                        type="button"
                        role="tab"
                        aria-controls="pills-Tips"
                        aria-selected="false"
                      >
                        <i class="fa-solid fa-lightbulb"></i>
                        Chef's Tips
                      </button>
                    </li>
                  </ul>
                  <div class="tab-content" id="pills-tabContent">
                    <div
                      class="tab-pane fade show active"
                      id="pills-Ingredients"
                      role="tabpanel"
                      aria-labelledby="pills-Ingredients-tab"
                      tabindex="0"
                    >
                      <div
                        id="ingredients-container"
                        class="bg-ingredients d-flex flex-column gap-3 rounded-4 p-3"
                      ></div>
                    </div>
                    <div
                      class="tab-pane fade"
                      id="pills-Instructions"
                      role="tabpanel"
                      aria-labelledby="pills-Instructions-tab"
                      tabindex="0"
                    >
                      <div
                        id="instructions-container"
                        class="d-flex flex-column gap-4 overflow-y-auto"
                      ></div>
                    </div>
                    <div
                      class="tab-pane fade"
                      id="pills-Nutrition"
                      role="tabpanel"
                      aria-labelledby="pills-Nutrition-tab"
                      tabindex="0"
                    >
                      <div id="nutrition-container" class="container">
                        <div class="row g-3">
                          <div class="col-md-6">
                            <div
                              class="nutrition-box p-3 d-flex justify-content-between rounded-2"
                            >
                              <div>
                                <div class="calories icon">
                                  <i class="fa-solid fa-fire"></i>
                                </div>
                                <span class="fs-7 fs-md-6">calories</span>
                              </div>
                              <div>
                                <span
                                  class="fw-bold"
                                  id="calories-value"
                                ></span>
                              </div>
                            </div>
                          </div>
                          <div class="col-md-6">
                            <div
                              class="nutrition-box p-3 d-flex justify-content-between rounded-2"
                            >
                              <div>
                                <div class="protein icon">
                                  <i class="fa-solid fa-dumbbell"></i>
                                </div>
                                <span class="fs-7 fs-md-6">protein</span>
                              </div>
                              <div>
                                <span class="fw-bold" id="protein-value"></span>
                              </div>
                            </div>
                          </div>
                          <div class="col-md-6">
                            <div
                              class="nutrition-box p-3 d-flex justify-content-between rounded-2"
                            >
                              <div>
                                <div class="carbs icon">
                                  <i class="fa-solid fa-wheat-awn"></i>
                                </div>
                                <span class="fs-7 fs-md-6">Carbohydrates</span>
                              </div>
                              <div>
                                <span class="fw-bold" id="carbs-value"></span>
                              </div>
                            </div>
                          </div>
                          <div class="col-md-6">
                            <div
                              class="nutrition-box p-3 d-flex justify-content-between rounded-2"
                            >
                              <div>
                                <div class="fat icon">
                                  <i class="fa-solid fa-droplet"></i>
                                </div>
                                <span class="fs-7 fs-md-6">fat</span>
                              </div>
                              <div>
                                <span class="fw-bold" id="fat-value"></span>
                              </div>
                            </div>
                          </div>
                          <div class="col-md-6">
                            <div
                              class="nutrition-box p-3 d-flex justify-content-between rounded-2"
                            >
                              <div>
                                <div class="fiber icon">
                                  <i class="fa-solid fa-seedling"></i>
                                </div>
                                <span class="fs-7 fs-md-6">fiber</span>
                              </div>
                              <div>
                                <span class="fw-bold" id="fiber-value"></span>
                              </div>
                            </div>
                          </div>
                          <div class="col-md-6">
                            <div
                              class="nutrition-box p-3 d-flex justify-content-between rounded-2"
                            >
                              <div>
                                <div class="sodium icon">
                                  <i class="fa-solid fa-cube"></i>
                                </div>
                                <span class="fs-7 fs-md-6">sodium</span>
                              </div>
                              <div>
                                <span class="fw-bold" id="sodium-value"></span>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                    <div
                      class="tab-pane fade"
                      id="pills-Tips"
                      role="tabpanel"
                      aria-labelledby="pills-Tips-tab"
                      tabindex="0"
                    >
                      <div
                        id="tips-container"
                        class="d-flex flex-column gap-4"
                      ></div>
                    </div>
                  </div>
                </div>

                <div class="pt-4 mt-4 border-top border-1">
                  <button
                    onclick="randomBtn()"
                    class="btn fw-semibold fs-7 fs-md-6 random-btn rounded-3"
                  >
                    <i class="fa-solid fa-rotate"></i> Try Another Recipe
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/meals.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
